<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="996px" preserveAspectRatio="none" style="width:694px;height:996px;background:#FFFFFF;" version="1.1" viewBox="0 0 694 996" width="694px" zoomAndPan="magnify"><title>E2E Testing: Recursive DAG for DemoShop Workflow</title><defs/><g><g class="title" data-source-line="3"><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="416.0557" x="137.4761" y="32.9951">E2E Testing: Recursive DAG for DemoShop Workflow</text></g><ellipse cx="295.5107" cy="57.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="203.1113" x="193.9551" y="87.2969"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.084" x="203.9551" y="108.4355">Navigate to Login</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="183.1113" x="203.9551" y="122.4043">(t1: GET /login; Val: HTTP 200)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="569.4961" x="11" y="155.2344"/><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="244.5547" x="24.5254" y="181.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="66.2461" x="34.5254" y="202.373">Valid Login</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="224.5547" x="34.5254" y="216.3418">(t2: POST creds; Val: Token received)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="269.416" x="297.0801" y="181.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="76.2832" x="307.0801" y="202.373">Invalid Login</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="249.416" x="307.0801" y="216.3418">(t3: POST bad creds; Val: 401 Error toast)</text><rect fill="#555555" height="6" rx="2.5" ry="2.5" style="stroke:#555555;stroke-width:1;" width="569.4961" x="11" y="249.1719"/><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="147.3184" x="221.8516" y="275.1719"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="127.3184" x="231.8516" y="296.3105">Branch to Dashboard</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="58.4297" x="231.8516" y="310.2793">(deps: t2)</text><path d="M469.6514,333.1094 L469.6514,379.5078 L449.6514,383.5078 L469.6514,387.5078 L469.6514,433.9063 A0,0 0 0 0 469.6514,433.9063 L682.0078,433.9063 A0,0 0 0 0 682.0078,433.9063 L682.0078,343.1094 L672.0078,333.1094 L469.6514,333.1094 A0,0 0 0 0 469.6514,333.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M672.0078,333.1094 L672.0078,343.1094 L682.0078,343.1094 L672.0078,333.1094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.3564" x="475.6514" y="350.1763">Recursive Subtask (depth=2)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="188.8428" x="475.6514" y="365.3091">Add 3 Random Products (t5):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="170.2568" x="475.6514" y="380.4419">- t5.1: Search 'electronics'</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.7632" x="475.6514" y="395.5747">- t5.2: Select random</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="137.0649" x="475.6514" y="410.7075">- t5.3: Click .add-cart</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="125.9629" x="475.6514" y="425.8403">Val: #cart-count=3</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="308.2813" x="141.3701" y="359.5391"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="112.4531" x="155.1846" y="380.6777">Browse Categories</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="288.2813" x="151.3701" y="394.6465">(t4: Click #nav-menu; Val: .category-list visible)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="260.1641" x="165.4287" y="453.9063"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.9961" x="175.4287" y="475.0449">Update Quantities</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="240.1641" x="175.4287" y="489.0137">(t6: Input qty=2; Val: Subtotal updated)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="259.5547" x="165.7334" y="521.8438"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="83.584" x="175.7334" y="542.9824">Apply Coupon</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="239.5547" x="175.7334" y="556.9512">(t7: Enter 'SAVE10'; Val: -10% discount)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="322.1973" x="134.4121" y="589.7813"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.7344" x="144.4121" y="610.9199">Proceed to Checkout</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="302.1973" x="144.4121" y="624.8887">(t8: Click #checkout-btn; Val: Form fields present)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="279.0605" x="155.9805" y="657.7188"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="80.4492" x="165.9805" y="678.8574">Select PayPal</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="259.0605" x="165.9805" y="692.8262">(t9: Click .paypal-option; Val: Modal opens)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="258.6289" x="166.1963" y="725.6563"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="114.7207" x="176.1963" y="746.7949">Complete Payment</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="238.6289" x="176.1963" y="760.7637">(t10: Submit; Val: HTTP 302 to success)</text><rect fill="#E1F5FE" height="47.9375" rx="12.5" ry="12.5" style="stroke:#01579B;stroke-width:0.5;" width="356.9551" x="117.0332" y="793.5938"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="73.3125" x="127.0332" y="814.7324">Verify Order</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="336.9551" x="127.0332" y="828.7012">(t11: Assert .order-id; Screenshot; Val: 'Thank you' text)</text><polygon fill="#E1F5FE" points="215.2827,861.5313,375.7388,861.5313,387.7388,873.5313,375.7388,885.5313,215.2827,885.5313,203.2827,873.5313,215.2827,861.5313" style="stroke:#01579B;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="160.4561" x="215.2827" y="877.3394">Error Path?