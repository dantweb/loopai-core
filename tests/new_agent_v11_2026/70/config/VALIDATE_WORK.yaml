session:
  name: Task execution
  code_source: 'VALIDATE_WORK.py'
  environment:
  loop:
    IF_AVAILABLE:
      description: "Check if we have no ongoing projects"
      type: if
      input:
        - filesystem:
            code_dir: /agentlife/current_work
      action:
        executor: if
        config:
          condition_func: isDirEmpty
          condition_func_args:
            - /agentlife/current_work
          condition_func_true: _exit
          condition_func_false: VALIDATE_WORK

    VALIDATE_WORK:
      description: "Read tasks and resolve them"
      type: llm
      input:
        - filesystem:
            code_dir: /agentlife/skills/project_thinking/protocols/validate
        - filesystem:
            code_dir: /agentlife/current_work
        - filesystem:
            code_dir: /agentlife/tasks/running
      output:
        - filesystem:
            code_dir: /agentlife/current_work
      action:
        executor: llm
        model: deepseek-reasoner
        prompt: VALIDATE_WORK_TASK
        system_content: SYSTEM_EXECUTE_TASK




