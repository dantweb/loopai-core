session:
  name: test code generator, bash and if executors
  code_source: '/tests/_data/loops/python/loop_gpt2code.py'
  environment:
  loop:
    gpt2code_step1:
      description: "Process Input with GPT-4"
      type: gpt2code_chunk
      input:
        - filesystem:
            code_dir: /tests/_data/gpt2code-src/test-app1
        - text:
            name: /tests/_data/gpt2code-src/test-app1/log/phpunit_cs.log
            field: unit_integration_log
        - text:
            name: /tests/_data/gpt2code-src/test-app1/task_from_master.txt
            field: user_task
      output:
        - filesystem:
            code_dir: /tests/_data/generated/gpt2code/
      action:
        executor: gpt2code_chunk
        model: gpt-4-turbo
        prompt: PROMPT_STEP_1_JSON
        system_content: SYSTEM_CONTENT_STEP_1
        max_tokens: 3000
    gpt2code_step2:
      description: Bash
      type: bash
      input:
        - text:
            name: /tests/_data/gpt2code-src/test-app1/log/phpunit_cs.log
      output:
        - text:
            name: /tests/_data/gpt2code-src/test-app1/log/phpunit_cs_json.log
      action:
        executor: bash
        config:
          bash_script_path: /tests/_data/loops/bash/gpt2code_run_tests.sh
